name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zeen-lien
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff2020&color_dots=#1a1a1a,#ff6b00,#ff8c00,#ffaa00,#ffcc00
            dist/github-contribution-grid-snake-dark.svg?color_snake=ff2020&color_dots=#1e1e2e,#ff6b00,#ff8c00,#ffaa00,#ffcc00
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
